<body>
<div id="app">
  <div class="awning"></div>
  <header>
    <div class="brand" data-act="secret">Parabola Park<small>Year 10 maths</small></div>
    <div class="stubs">
      <div class="stub" title="Coins"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#ffc93c" stroke="#1d2545" stroke-width="2"/><circle cx="10" cy="10" r="4" fill="none" stroke="#1d2545" stroke-width="1.5"/></svg><span id="coins" aria-label="coins">0</span></div>
      <div class="stub" title="Ride tickets"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5h16v3a2 2 0 0 0 0 4v3H2v-3a2 2 0 0 0 0-4z" fill="#ef4f6b" stroke="#1d2545" stroke-width="2" stroke-linejoin="round"/></svg><span id="tickets" aria-label="ride tickets">0</span></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="calc" hidden></div>
  <nav aria-label="Sections">
    <button data-act="go:park" id="nav-park">Park</button>
    <button data-act="go:learn" id="nav-learn">Learn</button>
    <button data-act="go:shop" id="nav-shop">Shop</button>
    <button data-act="go:plan" id="nav-plan">About</button>
  </nav>
</div>
<div id="toast" role="status"></div>
